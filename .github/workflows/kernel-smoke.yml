name: kernel-smoke

# 一加13 (dodge) 内核冒烟测试
# 只编 kernel Image，不打包 boot.img，不产出 ROM。
# 目的：验证 LineageOS sm8750 内核在 lineage-24.0 分支上能编过、defconfig 存在。
#
# 用法：把本目录推到 GitHub 仓库 → Actions → kernel-smoke → Run workflow
# 产物：kernel-Image / Image + build.log

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kernel-smoke.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8750
      KERNEL_BRANCH: lineage-24.0
      ARCH: arm64

    steps:
      - name: 清理 runner 腾空间
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          echo "== after =="; df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev rsync zip unzip \
            clang lld llvm

      - name: 拉内核源码（浅克隆）
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git log -1 --oneline
          echo "== 可用 sun 配置 =="
          ls arch/arm64/configs/vendor 2>/dev/null | grep -i sun || true

      - name: 选 defconfig
        id: cfg
        working-directory: kernel
        run: |
          for c in vendor/sun-perf_defconfig vendor/sun_defconfig vendor/sun_defconfig.gki; do
            if [ -f "arch/arm64/configs/$c" ]; then
              echo "config=$c" >> "$GITHUB_OUTPUT"
              echo "使用 $c"
              exit 0
            fi
          done
          echo "没找到 sun 相关 defconfig，回退 defconfig"
          echo "config=defconfig" >> "$GITHUB_OUTPUT"

      - name: 配置 + 编译 Image
        working-directory: kernel
        run: |
          set -o pipefail
          make O=out ARCH=$ARCH LLVM=1 "${{ steps.cfg.outputs.config }}" 2>&1 | tee config.log
          make O=out ARCH=$ARCH LLVM=1 -j"$(nproc)" Image 2>&1 | tee build.log

      - name: 结果
        if: always()
        run: |
          echo "== Image =="
          ls -lh kernel/out/arch/arm64/boot/Image || true
          echo "== 磁盘尾巴 =="
          df -h /
          echo "== 错误摘要 =="
          grep -nE "error:|Error [0-9]|No rule to make" kernel/build.log | tail -30 || true

      - name: 上传 Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          retention-days: 7

      - name: 上传日志（失败也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            kernel/build.log
            kernel/config.log
          retention-days: 7
          if-no-files-found: ignore
