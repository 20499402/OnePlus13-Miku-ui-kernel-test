name: kernel-smoke

# 一加13 (dodge) 内核冒烟测试（v2）
#
# 修正 v1 的两个错误：
#  1. 这个内核没有 vendor/sun_defconfig。真正的配置是 gki_defconfig
#     + arch/arm64/configs/vendor/sun_perf.config（fragment，Kleaf 会自动合并）。
#  2. drivers/base/kernelFwUpdate/Kconfig 不在此仓库，裸 make 解析 Kconfig 会失败。
#     CI 里用空 Kconfig/Makefile 占位，只验证核心内核能编过。
#
# 产物：Image + .config + 日志。不产出 boot.img / ROM。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kernel-smoke.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8750
      KERNEL_BRANCH: lineage-24.0
      ARCH: arm64

    steps:
      - name: 清理 runner 腾空间
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          echo "== after =="; df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev rsync zip unzip \
            clang lld llvm

      - name: 拉内核源码
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git log -1 --oneline
          echo "== vendor 配置 =="
          ls arch/arm64/configs/vendor 2>/dev/null | head -40 || true

      - name: 补齐所有缺失的 Kconfig（外部模块占位）
        working-directory: kernel
        run: |
          set -e
          echo "== 扫描 Kconfig 里 source 的缺失路径 =="
          grep -rhoE 'source "[^"]+"' --include='Kconfig*' . 2>/dev/null \
            | sed -E 's/^source "//; s/"$//' | sort -u | while read -r p; do
              case "$p" in
                *'$'*) continue ;;   # 带变量的路径跳过
              esac
              [ -f "$p" ] && continue
              d=$(dirname "$p")
              # 父目录是坏软链接/非目录时先删掉，否则 mkdir -p 会报 Already exists
              if [ -L "$d" ] || { [ -e "$d" ] && [ ! -d "$d" ]; }; then
                rm -rf "$d"
              fi
              mkdir -p "$d" || { echo "skip $p (mkdir failed)"; continue; }
              [ -L "$p" ] && rm -f "$p"
              echo "# CI stub: external module dir, not in kernel repo" > "$p" || { echo "skip $p (write failed)"; continue; }
              echo "stub: $p"
            done
          echo "== drivers/base 目录（前 30 行）=="
          ls -la drivers/base | head -30

      - name: 生成配置（gki_defconfig + sun_perf fragment）
        working-directory: kernel
        run: |
          set -o pipefail
          make O=out ARCH=$ARCH LLVM=1 gki_defconfig 2>&1 | tee config.log
          FRAG=arch/arm64/configs/vendor/sun_perf.config
          if [ -f "$FRAG" ]; then
            echo "== 追加 $FRAG =="
            cat "$FRAG" >> out/.config
            make O=out ARCH=$ARCH LLVM=1 olddefconfig 2>&1 | tee -a config.log
          else
            echo "没有 $FRAG，跳过 fragment"
          fi
          echo "== 最终配置摘要 =="
          grep -E 'CONFIG_LOCALVERSION|CONFIG_GKI|CONFIG_MODULES' out/.config | head -10 || true

      - name: 编译 Image
        working-directory: kernel
        run: |
          set -o pipefail
          make O=out ARCH=$ARCH LLVM=1 -j"$(nproc)" Image 2>&1 | tee build.log

      - name: 结果
        if: always()
        run: |
          echo "== Image =="
          ls -lh kernel/out/arch/arm64/boot/Image || true
          df -h /
          echo "== 错误摘要 =="
          grep -nE "error:|Error [0-9]|No rule to make|can't open file" kernel/build.log kernel/config.log 2>/dev/null | tail -40 || true

      - name: 上传 Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          retention-days: 7

      - name: 上传日志（失败也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            kernel/build.log
            kernel/config.log
          retention-days: 7
          if-no-files-found: ignore
